[project]
name = "tsmom"
version = "0.2.0"
description = "Improved Time Series Momentum (Moskowitz, Ooi & Pedersen 2012). Vol scaling, costs, multi-lookback ensemble, clean API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Improved from mirkovicdev/TSMOM" }]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "matplotlib>=3.7"]
viz = ["matplotlib>=3.7"]
full = ["yfinance>=0.2"]

[project.urls]
Source = "https://github.com/MichaelSwann2x/tsmom"
Original = "https://github.com/mirkovicdev/TSMOM"
Paper = "https://doi.org/10.1016/j.jfineco.2011.11.003"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsmom"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
